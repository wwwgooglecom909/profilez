<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@telegram</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;

      background:
        radial-gradient(circle at 20% 20%, #ff0019, transparent 30%),
        radial-gradient(circle at 80% 30%, #00eaff, transparent 30%),
        radial-gradient(circle at 50% 90%, #00ff51, transparent 35%),
        #080018;
    }

    .card {
      width: min(90%, 420px);
      padding: 40px 25px;
      text-align: center;
      border-radius: 30px;

      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.25);
      backdrop-filter: blur(20px);

      box-shadow:
        0 0 35px rgba(0,234,255,.3),
        0 0 80px rgba(255,0,204,.2);
    }

    .avatar {
      width: 120px;
      height: 120px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      font-size: 48px;
      font-weight: bold;

      background: linear-gradient(
        135deg,
        #f200ff,
        #00bfff,
        #00ff62
      );

      box-shadow:
        0 0 25px #00eaff,
        0 0 55px #00bbff;

      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.07);
        box-shadow:
          0 0 40px #00eaff,
          0 0 70px #ff00cc;
      }
    }

    h1 {
      margin-top: 25px;
      font-size: 36px;

      background: linear-gradient(
        90deg,
        #00eaff,
        white,
        #ff00cc,
        #ffe600
      );

      background-size: 300%;
      -webkit-background-clip: text;
      color: transparent;

      animation: rainbow 5s linear infinite;
    }

    @keyframes rainbow {
      to {
        background-position: 300%;
      }
    }

    .bio {
      margin: 18px 0 28px;
      color: #eee;
      line-height: 1.6;
    }

    .telegram {
      display: block;
      padding: 17px;

      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;

      border-radius: 16px;

      background: linear-gradient(
        135deg,
        #02abff,
        #0e02f3
      );

      box-shadow: 0 0 20px rgba(0,200,255,.5);

      transition: .3s;
    }

    .telegram:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow:
        0 0 30px #002aff,
        0 0 50px #16ec88;
    }

    .footer {
      margin-top: 25px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="avatar">🀄️</div>

    <h1>@telegram</h1>

    <p class="bio">
      ✨Welcome to my profile✨<br>
      ❤️欢迎来到您的个人主页❤️
    </p>

    <a
      class="telegram"
      href="https://t.me/shangban56789"
      target="_blank"
      rel="noopener noreferrer">
      ✈️ Telegram
    </a>

    <div class="footer">
      © 2026 @telegram
    </div>

  </div>

</body>
</html>
